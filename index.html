<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Wars — M1 Prototype</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050510;
        font-family: system-ui, -apple-system, sans-serif;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #hud {
        position: fixed;
        top: 12px;
        left: 14px;
        color: #05d9e8;
        font-weight: 600;
        text-shadow: 0 0 8px #05d9e8;
        user-select: none;
        pointer-events: none;
      }

      #hint {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        color: #ff2a6d;
        font-size: 13px;
        text-shadow: 0 0 6px #ff2a6d;
        user-select: none;
        pointer-events: none;
        text-align: center;
        white-space: nowrap;
      }

      #hud {
        display: flex;
        gap: 18px;
        align-items: baseline;
      }

      #hud .lbl {
        color: #ff2a6d;
        font-size: 11px;
        letter-spacing: 1px;
        margin-right: 4px;
        text-shadow: 0 0 6px #ff2a6d;
      }

      #hud .val.pulse {
        animation: wavepulse 0.45s ease-out;
      }

      @keyframes wavepulse {
        0% {
          color: #ffffff;
          text-shadow: 0 0 18px #00f0ff;
        }
        100% {
          color: #00f0ff;
          text-shadow: 0 0 8px #00f0ff;
        }
      }

      #hud .val {
        color: #00f0ff;
        font-size: 18px;
        text-shadow: 0 0 8px #00f0ff;
      }

      #hud .mult.on {
        color: #ffb800;
        text-shadow: 0 0 10px #ffb800;
      }

      #hud .mult.max {
        color: #ffd700;
        text-shadow: 0 0 14px #ffd700;
        animation: goldpulse 1s infinite;
      }

      @keyframes goldpulse {
        50% {
          color: #fff2a8;
          text-shadow: 0 0 22px #ffd700;
        }
      }

      #hud .spread {
        color: #00f0ff;
        font-size: 12px;
        text-shadow: 0 0 8px #00f0ff;
      }

      #hud .spread.off {
        opacity: 0.25;
      }

      #hud .lives .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 3px;
        border-radius: 50%;
        background: #05d9e8;
        box-shadow: 0 0 6px #05d9e8;
      }

      #hud .lives .dot.dead {
        background: transparent;
        box-shadow: none;
        border: 1px solid rgba(5, 217, 232, 0.4);
      }

      #gameover {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: rgba(5, 5, 16, 0.7);
        color: #ff2a6d;
        text-shadow: 0 0 12px #ff2a6d;
        font-family: inherit;
        font-size: 34px;
        letter-spacing: 2px;
      }

      #gameover .sub {
        margin-top: 14px;
        font-size: 16px;
        color: #00f0ff;
        text-shadow: 0 0 8px #00f0ff;
      }

      #gameover .restart {
        margin-top: 26px;
        font-size: 15px;
        color: #ffb800;
        text-shadow: 0 0 8px #ffb800;
        animation: blink 1s infinite;
      }

      /* ---- Leaderboard (game over) ---- */

      #gameover .entry {
        margin-top: 18px;
        display: none;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }

      #entryInitials {
        width: 84px;
        padding: 6px 8px;
        font-family: inherit;
        font-size: 20px;
        letter-spacing: 6px;
        text-align: center;
        text-transform: uppercase;
        color: #00f0ff;
        background: rgba(5, 5, 16, 0.9);
        border: 1px solid #05d9e8;
        border-radius: 4px;
        box-shadow: 0 0 8px #05d9e8;
        outline: none;
      }

      #entryInitials:focus {
        box-shadow: 0 0 14px #00f0ff;
      }

      #submitScore {
        padding: 6px 14px;
        font-family: inherit;
        font-size: 13px;
        letter-spacing: 2px;
        color: #050510;
        background: #05d9e8;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-shadow: none;
      }

      #submitScore:hover:enabled {
        background: #00f0ff;
        box-shadow: 0 0 12px #00f0ff;
      }

      #submitScore:disabled {
        opacity: 0.5;
        cursor: default;
      }

      #entryStatus {
        font-size: 13px;
        color: #ffb800;
        text-shadow: 0 0 8px #ffb800;
      }

      .board {
        margin-top: 24px;
        width: 300px;
        font-size: 14px;
        text-shadow: none;
      }

      .board-title {
        font-size: 13px;
        letter-spacing: 3px;
        color: #00f0ff;
        text-shadow: 0 0 8px #00f0ff;
        text-align: center;
        margin-bottom: 8px;
      }

      .board-title .off {
        color: #ff2a6d;
        text-shadow: 0 0 6px #ff2a6d;
      }

      #boardList {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      #boardList li {
        display: flex;
        justify-content: space-between;
        padding: 3px 6px;
        border-bottom: 1px solid rgba(5, 217, 232, 0.15);
      }

      #boardList li.empty {
        justify-content: center;
        color: #ff2a6d;
        text-shadow: 0 0 6px #ff2a6d;
        border-bottom: none;
        padding: 8px;
      }

      #boardList .rank {
        color: #ffb800;
        width: 26px;
        text-align: right;
        margin-right: 10px;
      }

      #boardList .ini {
        color: #05d9e8;
        letter-spacing: 3px;
        flex: 1;
      }

      #boardList .pts {
        color: #00f0ff;
        text-shadow: 0 0 6px #00f0ff;
      }

      #paused {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: rgba(5, 5, 16, 0.55);
        color: #00f0ff;
        text-shadow: 0 0 14px #00f0ff;
        font-family: inherit;
        font-size: 42px;
        letter-spacing: 4px;
      }

      #paused .sub {
        margin-top: 14px;
        font-size: 15px;
        color: #ff2a6d;
        text-shadow: 0 0 8px #ff2a6d;
      }

      @keyframes blink {
        50% { opacity: 0.25; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div><span class="lbl">WAVE</span><span class="val" id="wave">1</span></div>
      <div><span class="lbl">SCORE</span><span class="val" id="score">0</span></div>
      <div><span class="lbl">HI</span><span class="val" id="hi">0</span></div>
      <div><span class="lbl">MULT</span><span class="val" id="mult" class="mult">x1</span></div>
      <div><span class="lbl">BOMBS</span><span class="val" id="bombs">0</span></div>
      <div class="lives" id="lives"></div>
      <div><span class="spread off" id="spread"></span></div>
    </div>
    <div id="gameover">
      <div>GAME OVER</div>
      <div class="sub">SCORE&nbsp;<span id="finalScore">0</span></div>
      <div class="entry" id="entry">
        <input
          id="entryInitials"
          maxlength="3"
          autocomplete="off"
          spellcheck="false"
          placeholder="AAA"
          aria-label="Enter 1 to 3 initials"
        />
        <button id="submitScore">SUBMIT</button>
        <span id="entryStatus"></span>
      </div>
      <div class="board">
        <div class="board-title" id="boardTitle">LEADERBOARD</div>
        <ol id="boardList"></ol>
      </div>
      <div class="restart">Press any key / button to restart</div>
    </div>
    <div id="paused">
      <div>PAUSED</div>
      <div class="sub">Press Start / Esc to resume</div>
    </div>
    <div id="hint">Move left stick · aim right stick · B bomb · Y mute music · Start pause · 0-9/LB-RB wave</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
