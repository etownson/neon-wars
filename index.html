<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Wars — M1 Prototype</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050510;
        font-family: system-ui, -apple-system, sans-serif;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #hud {
        position: fixed;
        top: 12px;
        left: 14px;
        color: #05d9e8;
        font-weight: 600;
        text-shadow: 0 0 8px #05d9e8;
        user-select: none;
        pointer-events: none;
      }

      #hint {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        color: #ff2a6d;
        font-size: 13px;
        text-shadow: 0 0 6px #ff2a6d;
        user-select: none;
        pointer-events: none;
        text-align: center;
        white-space: nowrap;
      }

      #hud {
        display: flex;
        gap: 18px;
        align-items: baseline;
      }

      #hud .lbl {
        color: #ff2a6d;
        font-size: 11px;
        letter-spacing: 1px;
        margin-right: 4px;
        text-shadow: 0 0 6px #ff2a6d;
      }

      #hud .val {
        color: #00f0ff;
        font-size: 18px;
        text-shadow: 0 0 8px #00f0ff;
      }

      #hud .mult.on {
        color: #ffb800;
        text-shadow: 0 0 10px #ffb800;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div><span class="lbl">WAVE</span><span class="val" id="wave">1</span></div>
      <div><span class="lbl">SCORE</span><span class="val" id="score">0</span></div>
      <div><span class="lbl">MAX</span><span class="val" id="mult" class="mult">x1</span></div>
      <div><span class="lbl">KILLS</span><span class="val" id="kills">0</span></div>
    </div>
    <div id="hint">Left stick move · Right stick to aim &amp; auto-fire</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
